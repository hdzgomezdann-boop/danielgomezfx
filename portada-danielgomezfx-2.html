<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daniel Gómez FX</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#05080D;--gold:#B8975A;--gold2:#D4AF6E;
  --gold-dim:rgba(184,151,90,0.1);--gold-line:rgba(184,151,90,0.2);
  --text:#E8E2D9;--muted:#6B7280;--green:#34D399;
}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text);
  font-family:'DM Sans',sans-serif;
  min-height:100vh;overflow-x:hidden;
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:40px 24px;
}

/* GRAIN */
body::after{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:999;opacity:0.35}

/* GLOW */
.glow{position:fixed;top:0;left:50%;transform:translateX(-50%);width:600px;height:400px;background:radial-gradient(ellipse,rgba(184,151,90,0.06) 0%,transparent 70%);pointer-events:none;z-index:0}

/* CARD */
.card{
  position:relative;z-index:1;
  width:100%;max-width:420px;
  display:flex;flex-direction:column;align-items:center;
  gap:0;
}

/* PHOTO */
.photo-wrap{
  width:100%;border-radius:16px 16px 0 0;
  overflow:hidden;position:relative;
  aspect-ratio:3/4;
  border:1px solid var(--gold-line);
  border-bottom:none;
}
.photo-wrap img{
  width:100%;height:100%;
  object-fit:cover;object-position:center top;
  display:block;
}
.photo-wrap::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(to bottom,transparent 50%,rgba(5,8,13,0.95) 100%);
}

/* NAME OVER PHOTO */
.name-over{
  position:absolute;bottom:0;left:0;right:0;
  padding:28px 28px 24px;z-index:2;
}
.eyebrow{
  font-size:0.65rem;letter-spacing:0.18em;color:var(--gold);
  text-transform:uppercase;margin-bottom:8px;font-weight:500;
  opacity:0;transform:translateY(10px);
  transition:opacity 0.7s 0.3s,transform 0.7s 0.3s;
}
.eyebrow.v{opacity:1;transform:translateY(0)}
.name{
  font-family:'Playfair Display',serif;
  font-size:2.4rem;font-weight:900;line-height:1.05;
  letter-spacing:-0.02em;
  opacity:0;transform:translateY(14px);
  transition:opacity 0.8s 0.5s,transform 0.8s 0.5s;
}
.name.v{opacity:1;transform:translateY(0)}
.name span{color:var(--gold)}
.tagline{
  font-size:0.82rem;color:var(--muted);margin-top:8px;
  font-weight:300;line-height:1.5;
  opacity:0;transform:translateY(10px);
  transition:opacity 0.7s 0.7s,transform 0.7s 0.7s;
}
.tagline.v{opacity:1;transform:translateY(0)}

/* STATS BAR */
.stats-bar{
  width:100%;background:#090D14;
  border-left:1px solid var(--gold-line);border-right:1px solid var(--gold-line);
  display:grid;grid-template-columns:1fr 1fr 1fr;
  opacity:0;transform:translateY(10px);
  transition:opacity 0.7s 0.85s,transform 0.7s 0.85s;
}
.stats-bar.v{opacity:1;transform:translateY(0)}
.stat-item{
  padding:14px 12px;text-align:center;
  border-right:1px solid var(--gold-line);
}
.stat-item:last-child{border-right:none}
.stat-n{font-family:'Playfair Display',serif;font-size:1.2rem;font-weight:700;color:var(--gold);line-height:1}
.stat-l{font-size:0.58rem;color:var(--muted);margin-top:3px;font-weight:300}

/* BUTTONS */
.btns{
  width:100%;display:flex;flex-direction:column;gap:0;
  border:1px solid var(--gold-line);border-radius:0 0 16px 16px;overflow:hidden;
  opacity:0;transform:translateY(14px);
  transition:opacity 0.8s 1s,transform 0.8s 1s;
}
.btns.v{opacity:1;transform:translateY(0)}

.btn-main{
  display:flex;align-items:center;justify-content:center;gap:10px;
  background:var(--gold);color:#05080D;
  font-family:'DM Sans',sans-serif;font-size:0.95rem;font-weight:600;
  padding:18px 24px;text-decoration:none;
  transition:background 0.2s;position:relative;overflow:hidden;
  letter-spacing:0.01em;
}
.btn-main::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,0.12) 0%,transparent 55%)}
.btn-main:hover{background:var(--gold2)}

.btn-secondary{
  display:flex;align-items:center;justify-content:center;gap:10px;
  background:#090D14;color:var(--text);
  font-family:'DM Sans',sans-serif;font-size:0.95rem;font-weight:400;
  padding:18px 24px;text-decoration:none;
  border-top:1px solid var(--gold-line);
  transition:background 0.2s,color 0.2s;
}
.btn-secondary:hover{background:var(--gold-dim);color:var(--gold)}

/* SOCIAL */
.social{
  display:flex;gap:16px;margin-top:28px;
  opacity:0;transform:translateY(10px);
  transition:opacity 0.7s 1.1s,transform 0.7s 1.1s;
}
.social.v{opacity:1;transform:translateY(0)}
.social-link{
  display:flex;align-items:center;justify-content:center;
  width:36px;height:36px;border-radius:50%;
  border:1px solid var(--gold-line);color:var(--muted);
  text-decoration:none;transition:border-color 0.3s,color 0.3s,transform 0.3s;
}
.social-link:hover{border-color:var(--gold);color:var(--gold);transform:translateY(-2px)}

/* NOTE */
.note{
  font-size:0.65rem;color:var(--muted);margin-top:20px;text-align:center;
  opacity:0;transition:opacity 0.7s 1.2s;
}
.note.v{opacity:1}

@media(max-width:480px){
  .name{font-size:2rem}
  body{padding:24px 16px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
